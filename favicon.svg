  </defs>
  <rect width="64" height="64" rx="16" fill="#060810" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" />
  <circle cx="32" cy="32" r="26" fill="rgba(13, 20, 36, 0.6)" />
